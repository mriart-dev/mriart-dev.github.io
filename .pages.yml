media:
  input: img
  output: img
content:
  - name: proyectos
    label: Proyectos
    type: file
    path: data/proyectos.json
    list: true
    fields:
      - { name: id, label: "ID (sin espacios, ej: baja-bug)", type: string }
      - { name: titulo, label: Título, type: string }
      - { name: resumen, label: "Resumen (una línea)", type: string }
      - { name: descripcion, label: Descripción, type: text }
      - { name: herramientas, label: Herramientas, type: string, list: true }
      - { name: area, label: Área, type: string }
      - { name: contexto, label: "Contexto (materia, empresa, equipo)", type: string }
      - { name: documento, label: "Informe PDF (opcional)", type: file }
      - { name: mostrar_documento, label: "Mostrar el PDF dentro de la página", type: boolean }
      - { name: portada, label: Imagen de portada, type: image }
      - { name: portada_escala, label: "Tamaño de la portada (1 = normal, 0.8 = más chica)", type: number }
      - { name: imagenes, label: Galería, type: image, list: true }
  - name: perfil
    label: Perfil
    type: file
    path: data/perfil.json
    fields:
      - { name: nombre, label: Nombre, type: string }
      - { name: titulo, label: Título, type: string }
      - { name: bajada, label: Presentación, type: text }
      - { name: universidad, label: Universidad, type: string }
      - { name: email, label: Email, type: string }
      - { name: telefono, label: "Teléfono (con código de país)", type: string }
      - { name: foto, label: Foto de perfil, type: image }
      - { name: linkedin, label: "LinkedIn (URL)", type: string }
      - { name: cv, label: "CV en PDF", type: file }
      - { name: habilidades, label: Habilidades, type: string, list: true }
      - { name: idiomas, label: Idiomas, type: string, list: true }
      - name: certificaciones
        label: Certificados y títulos
        type: object
        list: true
        fields:
          - { name: nombre, label: Nombre, type: string }
          - { name: detalle, label: "Institución / año", type: string }
          - { name: archivo, label: "Archivo (nombre exacto dentro de certificados/)", type: string }
          - { name: clave, label: "O palabras del nombre del archivo (separadas por |)", type: string }
      - name: experiencia
        label: Experiencia y formación
        type: object
        list: true
        fields:
          - { name: fecha, label: Fecha, type: string }
          - { name: titulo, label: Puesto o título, type: string }
          - { name: lugar, label: "Empresa / institución", type: string }
          - { name: detalle, label: Detalle, type: text }
          - { name: fotos, label: Fotos, type: image, list: true }
  - name: estetica
    label: Estética
    type: file
    path: data/estetica.json
    fields:
      - { name: acento, label: Color de acento, type: string }
      - { name: fondo_oscuro, label: Fondo modo oscuro, type: string }
      - { name: fondo_claro, label: Fondo modo claro, type: string }
      - { name: tipografia, label: "Tipografía", type: select, options: { values: [Inter, Manrope, IBM Plex Sans, Space Grotesk, Sora] } }
      - { name: tema_inicial, label: Tema inicial, type: select, options: { values: [oscuro, claro] } }
      - { name: animacion_portada, label: Animación de portada, type: select, options: { values: [malla, grilla, ninguna] } }
      - { name: intensidad_animacion, label: "Intensidad (0 a 2)", type: number }
      - { name: goatcounter, label: "Código de GoatCounter (contador de visitas)", type: string }
